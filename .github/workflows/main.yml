name: github-actions-ci/cd

on: 
  push: 
    branches: [deploy_jinwo, deploy_dajeong, deploy_sunyoung]

jobs: 
  build:
    runs-on: ubuntu-latest
    env: 
      DOCKER_USERNAME: ${{
        github.ref_name == 'deploy_jinwo' && secrets.DOCKER_USERNAME_JINWO ||
        github.ref_name == 'deploy_dajeong' && secrets.DOCKER_USERNAME_DAJEONG ||
        github.ref_name == 'deploy_sunyoung' && secrets.DOCKER_USERNAME_SUNYOUNG
        }}
      DOCKER_PASSWORD:  ${{
        github.ref_name == 'deploy_jinwo' && secrets.DOCKER_PASSWORD_JINWO ||
        github.ref_name == 'deploy_dajeong' && secrets.DOCKER_PASSWORD_DAJEONG ||
        github.ref_name == 'deploy_sunyoung' && secrets.DOCKER_PASSWORD_SUNYOUNG
        }}
      APPLICATION_SECRET: ${{
        github.ref_name == 'deploy_jinwo' && secrets.APPLICATION_SECRET_JINWO ||
        github.ref_name == 'deploy_dajeong' && secrets.APPLICATION_SECRET_DAJEONG ||
        github.ref_name == 'deploy_sunyoung' && secrets.APPLICATION_SECRET_SUNYOUNG
        }}
      REACT_ENV: ${{
        github.ref_name == 'deploy_jinwo' && secrets.REACT_ENV_JINWO ||
        github.ref_name == 'deploy_dajeong' && secrets.REACT_ENV_DAJEONG ||
        github.ref_name == 'deploy_sunyoung' && secrets.REACT_ENV_SUNYOUNG
        }}
      SSH_HOST: ${{
        github.ref_name == 'deploy_jinwo' && secrets.SSH_HOST_JINWO ||
        github.ref_name == 'deploy_dajeong' && secrets.SSH_HOST_DAJEONG ||
        github.ref_name == 'deploy_sunyoung' && secrets.SSH_HOST_SUNYOUNG
        }}
      SSH_KEY: ${{
        github.ref_name == 'deploy_jinwo' && secrets.SSH_KEY_JINWO ||
        github.ref_name == 'deploy_dajeong' && secrets.SSH_KEY_DAJEONG ||
        github.ref_name == 'deploy_sunyoung' && secrets.SSH_KEY_SUNYOUNG
        }}
      BUILD_MODE: ${{
        github.ref_name == 'deploy_jinwo' && 'jinwo' ||
        github.ref_name == 'deploy_dajeong' && 'dajeong' ||
        github.ref_name == 'deploy_sunyoung' && 'sunyoung'
        }}
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: docker login
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: install JDK 21
        uses: actions/setup-java@v5.0.0
        with: 
          java-version: '21'
          distribution: 'temurin'

      - name: build spring boot app
        run: |
          cd running_back_S2
          echo ${{ env.APPLICATION_SECRET }} | base64 --decode > ./src/main/resources/application-secret.yml
          chmod 777 ./mvnw
          ./mvnw clean package -DskipTests
          docker build -t ${{ env.DOCKER_USERNAME }}/spring-app:latest .
          docker push ${{ env.DOCKER_USERNAME }}/spring-app:latest

      - name: build react app
        run: |
          cd running_front_S2
          echo ${{ env.REACT_ENV }} | base64 --decode > .env
          docker build --build-arg SERVERNAME=${{ env.BUILD_MODE }} -t ${{ env.DOCKER_USERNAME }}/react-app:latest .
          docker push ${{ env.DOCKER_USERNAME }}/react-app:latest

      - name: ssh 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ubuntu
          key: ${{ env.SSH_KEY }}
          script: |
            cd /home/ubuntu/project

            sudo dokcer-compose pull
            sudo docker-compose down
            sudo docker-compose up -d
